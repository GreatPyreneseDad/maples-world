<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wished Games · Maple's World</title>
<meta name="description" content="Games that kids wished up with Pip the unicorn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:linear-gradient(#2a1f5c,#5a3aa8 60%,#b06ad6) fixed;font-family:'Baloo 2',system-ui,sans-serif;color:#3a2a55}
body.playing{overflow:hidden;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#shelfPage{max-width:980px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px;text-align:center}
h1{margin:0;font-size:clamp(32px,8vw,56px);font-weight:800;color:#fff;text-shadow:0 3px 0 #6a3fd0,0 6px 18px rgba(0,0,0,.35);line-height:1}
.sub{color:#ffe38a;font-weight:700;font-size:clamp(15px,3.6vw,19px);margin:6px 0 20px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.tile{background:#fff;border-radius:24px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:16px;line-height:1.1;box-shadow:0 6px 0 #c9b7f5;min-height:138px;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #c9b7f5}
.tile .emo{font-size:62px;line-height:1.2}
#empty{color:#e6dcff;font-weight:700;font-size:18px;margin-top:30px}
a.home{display:inline-block;margin-top:28px;color:#fff;font-weight:700;text-decoration:none;background:rgba(255,255,255,.16);border-radius:16px;padding:8px 18px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#2a1f5c}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:center;padding-top:calc(10px + env(safe-area-inset-top))}
#hud>*{pointer-events:auto}
#back{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);font-size:25px;box-shadow:0 4px 0 rgba(0,0,0,.2);padding:0}
#hudName{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.85);border-radius:16px;padding:2px 14px;font-weight:800;font-size:15px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-radius:18px;padding:6px 16px;font-weight:800;font-size:19px;width:max-content;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .4s;opacity:0;z-index:3}
</style>
</head>
<body>
<div id="shelfPage">
  <h1>Wished Games</h1>
  <div class="sub">Games that kids wished up with Pip the unicorn</div>
  <div id="grid"></div>
  <div id="empty" hidden>No wished games yet. The first one is on its way!</div>
  <a class="home" href="/">← Maple's World</a>
</div>
<iframe id="frame" hidden sandbox="allow-scripts" title="Game"></iframe>
<div id="hud" hidden><button id="back" aria-label="Back to the shelf">🏠</button><div id="hudName"></div></div>
<div id="cap"></div>
<audio id="music" loop preload="none"></audio>
<script src="/pip-engine/pip-engine.js"></script>
<script>
'use strict';
/* Wished Games: the public shelf. Read only. Games run in a sealed frame with no network access. */
const API = 'https://cpobrznmlusoqrfrahsh.supabase.co/functions/v1/maker';
const $ = id => document.getElementById(id);
const frame = $('frame'), music = $('music');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d = 0.12, type = 'sine', v = 0.12, slide = 0, at = 0) { if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), a = AC.createGain(); o.type = type; o.frequency.setValueAtTime(Math.max(40, f), t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(v, t + 0.012); a.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(a).connect(AC.destination); o.start(t); o.stop(t + d + 0.02); }
let popN = 0;
const sfx = { pop() { tone(520 + (popN++ % 8) * 60, 0.14, 'triangle', 0.14, 240); }, join() { tone(660, 0.1, 'sine', 0.12); tone(880, 0.16, 'sine', 0.12, 0, 0.09); }, bonk() { tone(300, 0.3, 'sine', 0.16, -180); tone(200, 0.2, 'triangle', 0.1, 120, 0.12); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.13, 0, i * 0.11)); }, tap() { tone(700, 0.06, 'sine', 0.08); }, magic() { for (let i = 0; i < 7; i++) tone(700 + i * 170, 0.12, 'sine', 0.07, 0, i * 0.05); },
  boing() { tone(220, 0.28, 'sine', 0.16, 420); }, whoosh() { tone(900, 0.25, 'sawtooth', 0.05, -700); }, splash() { tone(500, 0.2, 'triangle', 0.1, -350); tone(900, 0.12, 'sine', 0.06, -500, 0.05); }, munch() { tone(260, 0.07, 'square', 0.07); tone(210, 0.07, 'square', 0.07, 0, 0.1); tone(250, 0.07, 'square', 0.07, 0, 0.2); } };
function frameDoc(gm) { return PIP_ENGINE.frameDoc(PIP_ENGINE.engine, gm); }
let capT = 0; function caption(t, hold) { const c = $('cap'); c.textContent = t; c.style.opacity = 1; clearTimeout(capT); capT = setTimeout(() => c.style.opacity = 0, hold || 2500 + t.length * 60); }
let playing = null;
async function play(x) { audio(); sfx.magic(); caption('Opening…', 8000);
  try { const r = await fetch(`${API}?op=get`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: x.id }) }); const gm = await r.json(); if (!r.ok || !gm.code) throw new Error('gone');
    playing = gm; document.body.classList.add('playing'); $('shelfPage').hidden = true; frame.hidden = false; $('hud').hidden = false; $('hudName').textContent = gm.name; frame.srcdoc = frameDoc(gm); caption(gm.how || 'Touch the screen to play!');
    if (gm.music_url) { music.src = gm.music_url; music.volume = 0.22; music.play().catch(() => {}); }
    history.replaceState(null, '', '?g=' + gm.id);
  } catch (e) { caption('That game could not be opened.'); } }
function back() { playing = null; frame.srcdoc = ''; frame.hidden = true; $('hud').hidden = true; $('shelfPage').hidden = false; document.body.classList.remove('playing'); music.pause(); music.removeAttribute('src'); $('cap').style.opacity = 0; history.replaceState(null, '', location.pathname); }
$('back').onclick = back;
addEventListener('message', e => { if (e.source !== frame.contentWindow || !e.data || !e.data.gm || !playing) return; const d = e.data;
  if (d.type === 'sound') { if (sfx[d.name]) sfx[d.name](); else sfx.pop(); }
  else if (d.type === 'note') tone(clamp(+d.freq || 440, 60, 4000), clamp(+d.dur || 0.15, 0.03, 1), 'triangle', 0.12);
  else if (d.type === 'win') sfx.win();
  else if (d.type === 'say') caption(String(d.text).slice(0, 90));
  else if (d.type === 'error') { caption('Oops, this game tripped. Back to the shelf!'); setTimeout(back, 2200); } });
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) music.pause(); else if (playing && music.src) music.play().catch(() => {}); });
(async () => { let games = [];
  try { const r = await fetch(`${API}?op=list`, { method: 'POST' }); games = (await r.json()).games || []; } catch (e) {}
  const grid = $('grid'); $('empty').hidden = games.length > 0;
  for (const x of games) { const b = document.createElement('button'); b.className = 'tile'; const e = document.createElement('div'); e.className = 'emo'; e.textContent = x.icon || '🎮'; const s = document.createElement('span'); s.textContent = x.name; b.append(e, s); b.onclick = () => play(x); grid.appendChild(b); }
  const g0 = new URLSearchParams(location.search).get('g'); const hit = g0 && games.find(x => x.id === g0);
  if (hit) { const b = document.createElement('button'); b.className = 'tile'; b.style.cssText = 'grid-column:1/-1;background:#ffd84d;box-shadow:0 6px 0 #c97a00;min-height:90px;font-size:22px'; b.textContent = `▶ Play ${hit.icon} ${hit.name}`; b.onclick = () => play(hit); grid.prepend(b); }
  window.__wished = { games, play, back, state: () => ({ playing: playing && playing.name }) };
})();

</script>
</body>
</html>
