<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cat Crew · Maple's World</title>
<meta name="description" content="Walk around the village, pick up cats and kittens, feed them, brush them, dress them up, and they follow you everywhere.">
<meta property="og:title" content="Cat Crew">
<meta property="og:description" content="Find cats and kittens, feed, groom and dress them, and build a following.">
<meta property="og:url" content="https://maplesworld.org/cat-crew/">
<meta name="theme-color" content="#7cc47a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 5l7 6h8l7-6v15a11 11 0 0 1-22 0z' fill='%23f29a4a'/%3E%3Ccircle cx='12' cy='18' r='2' fill='%232b2a33'/%3E%3Ccircle cx='20' cy='18' r='2' fill='%232b2a33'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: the village fills the screen. Picking up a cat opens one card: big face on top, three care tabs under it. */
:root{
  color-scheme: light;
  --grass:#8fd37f;
  --grass-2:#7cc47a;
  --paper:#fffaf2;
  --ink:#3a2f4a;
  --ink-dim:#7a6f8a;
  --peach:#ffb38a;        /* care screen backdrop */
  --berry:#e8577e;
  --butter:#ffd166;
  --line:rgba(58,47,74,.14);
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--grass-2);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,a{touch-action:manipulation;font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:3;align-items:center}
.top.l{left:calc(8px + env(safe-area-inset-left,0px))}.top.r{right:calc(8px + env(safe-area-inset-right,0px))}
.ib{font:800 13px var(--body);color:var(--ink);background:rgba(255,250,242,.9);border:0;border-radius:999px;height:36px;padding:0 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#count{font-family:var(--display);font-weight:800;font-size:18px;gap:6px}
#pick{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:var(--berry);border:0;border-radius:999px;padding:12px 30px;box-shadow:0 6px 0 #b73a5d;cursor:pointer;white-space:nowrap}
#pick:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #b73a5d}

.veil{position:fixed;inset:0;display:flex;overflow-y:auto;padding:14px;z-index:5;touch-action:pan-y}
#start{background:rgba(124,196,122,.8)}
#care{background:linear-gradient(#ffd9b8,#ffb38a)}
.card{margin:auto;width:min(520px,100%);background:var(--paper);border-radius:28px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:13px;box-shadow:0 9px 0 rgba(58,47,74,.16)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,64px);line-height:.92;margin:0;color:var(--ink);text-wrap:balance}
h1 span{color:var(--berry)}
p{margin:0;font-size:16.5px;line-height:1.4;font-weight:600;color:var(--ink-dim);max-width:40ch}
.home{color:var(--ink-dim);font-size:13px;font-weight:800;text-decoration:none;align-self:flex-start}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who button{background:#eaf6e6;border:3px solid transparent;border-radius:16px;padding:2px;cursor:pointer}
.who button[aria-pressed="true"]{border-color:var(--berry);background:#fff0f3}
.who canvas{width:100%;aspect-ratio:1;display:block}
.go{font-family:var(--display);font-weight:800;font-size:24px;color:#fff;background:var(--berry);border:0;border-radius:999px;padding:11px 38px;cursor:pointer;box-shadow:0 6px 0 #b73a5d;align-self:flex-start}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b73a5d}
.keys{font-size:13px;font-weight:600;color:var(--ink-dim);line-height:1.6}
kbd{font:800 12px var(--body);color:var(--ink);background:#eee7dc;border-radius:5px;padding:1px 6px}

.cc{margin:auto;width:min(560px,100%);display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#cname{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--ink)}
#ckind{font-size:13px;font-weight:800;color:var(--ink-dim)}
.small{font:800 13px var(--body);color:var(--ink);background:rgba(255,255,255,.75);border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
.meters{margin-left:auto;display:flex;gap:12px;font-size:12px;font-weight:800;color:var(--ink);align-items:center}
.meters u{display:inline-block;width:64px;height:10px;border-radius:5px;background:rgba(255,255,255,.6);overflow:hidden;vertical-align:middle;margin-left:5px;text-decoration:none}
.meters u i{display:block;height:100%;width:calc(var(--v)*100%);background:var(--berry);border-radius:5px;transition:width .3s}
#face{width:min(100%,calc(44vh * 1.2));justify-self:center;aspect-ratio:6/5;display:block;background:radial-gradient(circle at 50% 45%,#fff6ea,#ffe2c4);border-radius:26px;touch-action:none;cursor:grab}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);background:rgba(255,255,255,.6);border:0;border-radius:16px;padding:9px 6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--paper);box-shadow:0 4px 0 rgba(58,47,74,.16)}
#cpanel{background:var(--paper);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:104px;max-height:30vh;overflow-y:auto;touch-action:pan-y}
.hint{font-size:13.5px;font-weight:800;color:var(--ink-dim);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.opt{background:#f4eee4;border:3px solid transparent;border-radius:14px;padding:3px 3px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:800 11.5px var(--body);color:var(--ink);line-height:1.1;text-align:center}
.opt canvas{width:100%;aspect-ratio:1;display:block}
.opt[aria-pressed="true"]{border-color:var(--berry);background:#fff0f3}
.grp{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
#done{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:#3aa76d;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 6px 0 #27794d}
#done:active{transform:translateY(4px);box-shadow:0 2px 0 #27794d}
@media (orientation:landscape) and (max-height:560px){.cc{width:min(900px,100%);grid-template-columns:minmax(0,46%) minmax(0,1fr);align-items:start}.chead{grid-column:1 / span 2}#face{grid-row:2 / span 4;width:min(100%,calc(74vh * 1.2))}#cpanel{max-height:38vh}}
</style>
</head>
<body>
<canvas id="c" aria-label="Cat Crew. Walk around and find cats."></canvas>
<div class="top l" id="tl" hidden><a class="ib" href="/">&larr; Maple's World</a></div>
<div class="top r" id="tr" hidden><div class="ib" id="count">0 cats</div><button class="ib" id="sound" type="button" aria-pressed="true">Sound on</button></div>
<button id="pick" type="button" hidden>Pick up</button>

<div class="veil" id="start">
  <div class="card">
    <a class="home" href="/">&larr; Maple's World</a>
    <h1>Cat <span>Crew</span></h1>
    <p>Cats and kittens are hiding all over the village. Pick one up, feed it, brush it, dress it up, and it will follow you everywhere.</p>
    <div class="who" id="who"></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <button class="go" id="go" type="button">Go find cats</button>
      <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or drag to walk<br><kbd>Space</kbd> or tap a cat to pick it up</div>
    </div>
  </div>
</div>

<div class="veil" id="care" hidden>
  <div class="cc">
    <div class="chead"><div><div id="cname"></div><div id="ckind"></div></div><button class="small" id="rename" type="button">New name</button>
      <div class="meters"><span>Tummy<u><i id="m-tum" style="--v:0"></i></u></span><span>Fluff<u><i id="m-fluff" style="--v:0"></i></u></span></div></div>
    <canvas id="face" width="720" height="600" aria-label="The cat's face. Stroke it to pet."></canvas>
    <div class="tabs" role="tablist"><button class="tab" data-tab="feed" type="button">Feed</button><button class="tab" data-tab="groom" type="button">Brush</button><button class="tab" data-tab="dress" type="button">Dress up</button></div>
    <div id="cpanel"></div>
    <button id="done" type="button">All done. Come along!</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, PI = Math.PI;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const cv = $('c'); let g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, tNow = 0;
const WW = 2400, WH = 1700;

/* ---------- sound ---------- */
let soundOn = true; try { soundOn = localStorage.getItem('cat-crew-sound') !== '0'; } catch (e) {}
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!soundOn) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.012); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v).connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
}
let lastPurr = 0, lastBrush = 0;
const SFX = {
  meow: k => { tone('triangle', 640 * k, 960 * k, 0.13, 0.12); tone('triangle', 960 * k, 540 * k, 0.22, 0.12, 0.12); },
  purr: () => { if (tNow - lastPurr < 0.5) return; lastPurr = tNow; for (let i = 0; i < 7; i++) tone('sawtooth', 56, 48, 0.06, 0.09, i * 0.07); },
  munch: () => { for (let i = 0; i < 4; i++) tone('square', 170 - i * 10, 90, 0.05, 0.08, i * 0.16); },
  brush: () => { if (tNow - lastBrush < 0.12) return; lastBrush = tNow; tone('triangle', rnd(1800, 2600), 900, 0.07, 0.03); },
  clean: () => tone('sine', 1320, 1760, 0.12, 0.1),
  wear: () => { tone('triangle', 660, 660, 0.09, 0.11); tone('triangle', 990, 990, 0.13, 0.11, 0.07); },
  up: () => [0, 4, 7].forEach((s, i) => tone('triangle', 587 * Math.pow(2, s / 12), 587 * Math.pow(2, s / 12), 0.16, 0.13, i * 0.07)),
  join: () => [0, 4, 7, 12].forEach((s, i) => tone('triangle', 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.2, 0.14, i * 0.09)),
  no: () => tone('sine', 380, 260, 0.16, 0.09),
  all: () => [0, 4, 7, 12, 16, 19].forEach((s, i) => tone('triangle', 523 * Math.pow(2, s / 12), 523 * Math.pow(2, s / 12), 0.24, 0.14, i * 0.11)),
};

/* ---------- drawing kit ---------- */
const OUT = 'rgba(60,40,45,.42)';
function shape(fill, stroke = OUT, lw = 1.5) { g.fillStyle = fill; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function poly(...p) { g.beginPath(); for (let i = 0; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); }
function starPath(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - PI / 2, q = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } g.closePath(); }
function heartPath(x, y, r) { g.beginPath(); g.moveTo(x, y + r * 0.9); g.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.7, y - r * 1.3, x, y - r * 0.5); g.bezierCurveTo(x + r * 0.7, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); g.closePath(); }

/* ---------- cats ---------- */
const COATS = {
  orange:  { label:'orange tabby', base:'#f29a4a', light:'#fbd9b4', dark:'#c96f24', iris:'#7cc24a', stripes:1 },
  black:   { label:'black', base:'#3b3945', light:'#55525f', dark:'#24222b', iris:'#ffd84d' },
  white:   { label:'white', base:'#fbfaf6', light:'#ffffff', dark:'#e3e0d8', iris:'#5ab4e6' },
  gray:    { label:'gray tabby', base:'#9aa3ad', light:'#c9d0d7', dark:'#727b86', iris:'#f2b84b', stripes:1 },
  calico:  { label:'calico', base:'#fbfaf6', light:'#ffffff', dark:'#e3e0d8', iris:'#8fcf5a', calico:1 },
  siamese: { label:'siamese', base:'#efe3cf', light:'#f7efe0', dark:'#5b4337', iris:'#4aa3e0', mask:1 },
  tuxedo:  { label:'tuxedo', base:'#3b3945', light:'#fbfaf6', dark:'#24222b', iris:'#8fcf5a', bib:1 },
  tabby:   { label:'brown tabby', base:'#a9794c', light:'#d9b890', dark:'#6f4a2a', iris:'#e0b23a', stripes:1 },
  cream:   { label:'cream', base:'#f6e2bf', light:'#fff3dc', dark:'#dcc296', iris:'#e0913a' },
  ginger:  { label:'ginger and white', base:'#f29a4a', light:'#fbfaf6', dark:'#c96f24', iris:'#5ab4e6', bib:1, stripes:1 },
};
const NAMES = ['Mochi', 'Biscuit', 'Pepper', 'Pumpkin', 'Luna', 'Olive', 'Waffles', 'Peanut', 'Shadow', 'Marble', 'Clover', 'Ginger', 'Socks', 'Pickles', 'Noodle', 'Mango', 'Pebble', 'Snowball', 'Cookie', 'Daisy', 'Poppy', 'Smudge', 'Whiskers', 'Boots', 'Honey', 'Maple', 'Button', 'Dumpling', 'Toffee', 'Bean', 'Juniper', 'Pudding', 'Sprout', 'Truffle', 'Fig', 'Nutmeg'];
// what a cat can wear: slot -> options. Each draws on the big face (head radius about 100) and small on the walking cat
const WEAR = {
  neck: [['collar-red', 'Red collar'], ['collar-blue', 'Blue collar'], ['collar-pink', 'Pink collar'], ['bowtie', 'Bow tie'], ['bandana', 'Bandana'], ['pearls', 'Pearls']],
  head: [['bow', 'Bow'], ['flower', 'Flower'], ['party', 'Party hat'], ['crown', 'Crown'], ['tophat', 'Top hat'], ['beanie', 'Beanie']],
  eyes: [['round', 'Glasses'], ['heart', 'Heart glasses'], ['shades', 'Shades'], ['star', 'Star glasses']],
};
const NECKCOL = { 'collar-red':'#e2433b', 'collar-blue':'#3f8cff', 'collar-pink':'#ff7fb0', bowtie:'#7a4fd6', bandana:'#e2433b', pearls:'#fffaf0' };
const HEADCOL = { bow:'#ff5fa2', flower:'#ffd23f', party:'#7a4fd6', crown:'#ffd23f', tophat:'#2b2233', beanie:'#19c2b0' };
function drawWearBig(id) {
  if (id.startsWith('collar')) { g.beginPath(); g.moveTo(-62, 96); g.quadraticCurveTo(0, 126, 62, 96); g.lineTo(60, 112); g.quadraticCurveTo(0, 142, -60, 112); g.closePath(); shape(NECKCOL[id]); ell(0, 132, 11, 11); shape('#ffd23f', '#b8860b'); g.fillStyle = '#b8860b'; ell(0, 135, 2.5, 2.5); g.fill(); }
  else if (id === 'bowtie') { poly(0, 118, -40, 98, -40, 138); shape('#7a4fd6'); poly(0, 118, 40, 98, 40, 138); shape('#7a4fd6'); ell(0, 118, 10, 11); shape('#5a35b0'); }
  else if (id === 'bandana') { poly(-64, 96, 64, 96, 0, 160); shape('#e2433b'); g.fillStyle = '#fff'; for (const [x, y] of [[-24, 108], [24, 108], [0, 122], [0, 102], [-10, 136], [10, 136]]) { ell(x, y, 3.2, 3.2); g.fill(); } }
  else if (id === 'pearls') { for (let i = -5; i <= 5; i++) { ell(i * 12, 104 + (25 - i * i) * 0.75, 7, 7); shape('#fffaf0', 'rgba(120,100,110,.5)', 1); } }
  else if (id === 'bow') { g.save(); g.translate(62, -86); g.rotate(0.35); poly(0, 0, -34, -20, -34, 20); shape('#ff5fa2'); poly(0, 0, 34, -20, 34, 20); shape('#ff5fa2'); ell(0, 0, 9, 10); shape('#d93a82'); g.restore(); }
  else if (id === 'flower') { g.save(); g.translate(-66, -82); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ell(Math.cos(a) * 15, Math.sin(a) * 15, 12, 12); shape('#ff8fc4', 'rgba(150,60,100,.4)', 1); } ell(0, 0, 10, 10); shape('#ffd23f', null); g.restore(); }
  else if (id === 'party') { poly(-36, -84, 6, -176, 44, -78); shape('#7a4fd6'); g.strokeStyle = '#ffd23f'; g.lineWidth = 6; g.beginPath(); g.moveTo(-22, -104); g.lineTo(32, -102); g.moveTo(-8, -134); g.lineTo(20, -132); g.stroke(); ell(6, -178, 10, 10); shape('#ff5fa2'); }
  else if (id === 'crown') { poly(-46, -80, -52, -134, -24, -106, 0, -146, 24, -106, 52, -134, 46, -80); shape('#ffd23f', '#b8860b', 2); for (const [x, y, c] of [[0, -98, '#e2433b'], [-28, -92, '#3f8cff'], [28, -92, '#3f8cff']]) { ell(x, y, 6, 6); shape(c, null); } }
  else if (id === 'tophat') { ell(0, -86, 62, 13); shape('#2b2233'); g.beginPath(); g.roundRect(-38, -160, 76, 76, 6); shape('#2b2233'); g.fillStyle = '#e8577e'; g.fillRect(-38, -104, 76, 13); }
  else if (id === 'beanie') { g.beginPath(); g.arc(0, -70, 74, PI * 1.04, PI * 1.96); g.closePath(); shape('#19c2b0'); g.beginPath(); g.roundRect(-74, -84, 148, 24, 10); shape('#12998b'); ell(0, -146, 15, 15); shape('#fff'); }
  else if (id === 'round') { g.strokeStyle = '#2b2233'; g.lineWidth = 5; ell(-42, -8, 30, 30); g.stroke(); ell(42, -8, 30, 30); g.stroke(); g.beginPath(); g.moveTo(-12, -8); g.lineTo(12, -8); g.stroke(); }
  else if (id === 'heart') { for (const s of [-1, 1]) { heartPath(s * 42, -8, 24); g.fillStyle = 'rgba(255,95,162,.55)'; g.fill(); g.strokeStyle = '#d93a82'; g.lineWidth = 5; g.stroke(); } g.beginPath(); g.moveTo(-14, -12); g.lineTo(14, -12); g.stroke(); }
  else if (id === 'shades') { for (const s of [-1, 1]) { g.beginPath(); g.roundRect(s * 42 - 32, -28, 64, 40, 14); shape('#2b2233', null); g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(s * 42 - 22, -22, 16, 6); } g.strokeStyle = '#2b2233'; g.lineWidth = 6; g.beginPath(); g.moveTo(-12, -14); g.lineTo(12, -14); g.stroke(); }
  else if (id === 'star') { for (const s of [-1, 1]) { starPath(s * 42, -8, 34); g.fillStyle = 'rgba(255,210,63,.55)'; g.fill(); g.strokeStyle = '#b8860b'; g.lineWidth = 4; g.stroke(); } }
}
// the big face. Head centre at 0,0, about 110 wide each way. st: { happy, chew, lookX, lookY, blink }
function drawFace(cat, t, st = {}) {
  const C = COATS[cat.coat], kit = cat.kitten, ey = kit ? 1.22 : 1;
  // shoulders
  ell(0, 172, 128, 84); shape(C.base);
  if (C.bib) { ell(0, 160, 62, 74); shape(C.light, null); }
  if (C.calico) { ell(-70, 170, 46, 50); shape('#f29a4a', null); ell(84, 190, 36, 40); shape('#3b3945', null); }
  if (cat.wear.neck === 'bandana') drawWearBig('bandana');
  // ears

document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive:false });
$('pick').addEventListener('click', () => pickUp(near));

const pv = [];
function buildWho() { const box = $('who'); KIDS.forEach((k, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(i === kid)); b.setAttribute('aria-label', 'Kid ' + (i + 1)); b.innerHTML = '<canvas width="160" height="160"></canvas>'; b.addEventListener('click', () => { kid = i; audio(); SFX.up(); for (const o of box.children) o.setAttribute('aria-pressed', String(o === b)); }); box.appendChild(b); pv.push(b.firstChild.getContext('2d')); }); }
const demoCat = { coat:'orange', wear:{ neck:'collar-blue', head:null, eyes:null }, seed:1 };
function previews() { if ($('start').hidden) return; const o = g; pv.forEach((c, i) => { g = c; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 160, 160); g.setTransform(3, 0, 0, 3, 68, 80); g.rotate(-PI / 2 + Math.sin(tNow * 2 + i) * 0.15); drawKidTop(KIDS[i], tNow, i === kid); if (i === kid) { g.setTransform(1.7, 0, 0, 1.7, 122, 118); g.rotate(-PI / 2); drawCatTop(demoCat, tNow, 'walk'); } }); g = o; }
function start() { audio(); me = { x:1200, y:600, vx:0, vy:0, ang:PI / 2, step:0 }; cats = []; crew = []; trail = []; fx = []; wave = 0; spawnWave(); playing = true; $('start').hidden = true; $('tl').hidden = false; $('tr').hidden = false; $('count').textContent = '0 cats'; SFX.meow(1); cv.focus(); }
$('go').addEventListener('click', start);
const sb = $('sound'), paint = () => { sb.textContent = soundOn ? 'Sound on' : 'Sound off'; sb.setAttribute('aria-pressed', String(soundOn)); };
sb.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('cat-crew-sound', soundOn ? '1' : '0'); } catch (e) {} paint(); if (soundOn) { audio(); SFX.meow(1); } });
cv.tabIndex = -1; cv.style.outline = 'none';
buildWho(); paint(); resize(); requestAnimationFrame(frame);
window.__cats = { get me() { return me; }, get cats() { return cats; }, get crew() { return crew; }, get caring() { return caring; }, get near() { return near; }, update, pickUp, closeCare, start, COATS, WEAR, draw:{ face:(ctx, cat, t, st) => { const o = g; g = ctx; drawFace(cat, t, st); g = o; }, top:(ctx, cat, t, p) => { const o = g; g = ctx; drawCatTop(cat, t, p); g = o; } }, mute:() => { soundOn = false; } };   // for tests
})();
</script>
